[global]
daemonize = no
error_log = /proc/self/fd/2
log_level = warning

[www]
listen = 9000
listen.backlog = 511
user = www-data
group = www-data

pm = dynamic
pm.max_children = 30
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 1000

catch_workers_output = yes
decorate_workers_output = no
clear_env = no
