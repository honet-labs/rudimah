[global]
daemonize = no
error_log = /proc/self/fd/2
log_level = warning

[www]
listen = 9000
listen.backlog = 1024
user = www-data
group = www-data

pm = dynamic
pm.max_children = 50
pm.start_servers = 6
pm.min_spare_servers = 3
pm.max_spare_servers = 12
pm.max_requests = 1000

pm.status_path = /fpm-status
ping.path = /fpm-ping

catch_workers_output = yes
decorate_workers_output = no
clear_env = no

