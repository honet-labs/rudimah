upstream php_backend {
    server app:9000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 20M;

    include /etc/nginx/security.conf;

    # Health check cepat tanpa menyentuh PHP-FPM
    location = /up {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Caching aset frontend statis (Vite build, gambar, fonts)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf|map)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php_backend;
        fastcgi_keep_conn on;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Deteksi HTTPS dari Reverse Proxy / Cloudflare / Tunnel
        set $fastcgi_https "off";
        set $forwarded_proto "http";

        if ($http_x_forwarded_proto = "https") {
            set $fastcgi_https "on";
            set $forwarded_proto "https";
        }
        if ($http_x_forwarded_ssl = "on") {
            set $fastcgi_https "on";
            set $forwarded_proto "https";
        }
        if ($http_cf_visitor ~* '"scheme":"https"') {
            set $fastcgi_https "on";
            set $forwarded_proto "https";
        }
        if ($https = "on") {
            set $fastcgi_https "on";
            set $forwarded_proto "https";
        }

        fastcgi_param HTTPS $fastcgi_https if_not_empty;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $forwarded_proto;

        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_connect_timeout 10s;
        fastcgi_send_timeout 180s;
        fastcgi_read_timeout 180s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

