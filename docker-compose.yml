services:
  nginx:
    image: nginx:alpine
    container_name: rudimah_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - app_public:/var/www/html/public:ro
      - ./docker/nginx/http.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/security.conf:/etc/nginx/security.conf:ro
      - certs_data:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - rudimah_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rudimah_app
    restart: unless-stopped
    env_file: .env
    volumes:
      - app_public:/var/www/html/public
      - storage_data:/var/www/html/storage
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rudimah_network

  horizon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rudimah_horizon
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90"]
    env_file: .env
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      - app
    networks:
      - rudimah_network

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rudimah_scheduler
    restart: unless-stopped
    command: ["sh", "-c", "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"]
    env_file: .env
    depends_on:
      - app
    networks:
      - rudimah_network

  mariadb:
    image: mariadb:11.4
    container_name: rudimah_mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-mariadb_root_pass}
      MYSQL_DATABASE: ${DB_PLATFORM_DATABASE:-rudimah_platform}
      MYSQL_USER: ${DB_PLATFORM_USERNAME:-rudimah_user}
      MYSQL_PASSWORD: ${DB_PLATFORM_PASSWORD:-rudimah_secret_pass}
      DB_PEKAN_DATABASE: ${DB_PEKAN_DATABASE:-rudimah_pekan}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb/custom.cnf:/etc/mysql/conf.d/custom.cnf:ro
      - ./docker/mariadb/init-dual-db.sh:/docker-entrypoint-initdb.d/init-dual-db.sh:ro
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-mariadb_root_pass}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rudimah_network

  redis:
    image: redis:7-alpine
    container_name: rudimah_redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rudimah_network

networks:
  rudimah_network:
    driver: bridge

volumes:
  mariadb_data:
  redis_data:
  storage_data:
  certs_data:
  app_public:
